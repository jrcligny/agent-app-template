name: Release example

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to build images. This workflow does not deploy.
        required: true
        type: string

permissions:
  contents: read

jobs:
  images:
    if: ${{ github.event.inputs.confirm == 'publish' && vars.ENABLE_EXAMPLE_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse an unconfigured cloud role
        env:
          ROLE: ${{ vars.EXAMPLE_CLOUD_ROLE }}
        run: |
          if [ -z "$ROLE" ] || [ "$ROLE" = "REPLACE_WITH_CLOUD_ROLE" ]; then
            echo "No cloud role is configured. See docs/guide/deployment.md. Nothing was deployed."
            exit 1
          fi
          echo "A role variable is set. This example still does not push or deploy."
      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build API image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: agent-app-api:example
      - name: Build web image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: agent-app-web:example
