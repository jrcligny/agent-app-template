name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://app:ci-only@localhost:5432/app
      OPENSPEC_TELEMETRY: "0"
      DO_NOT_TRACK: "1"
      STORYBOOK_DISABLE_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Architecture
        run: pnpm check:architecture
      - name: Skill layout
        run: pnpm check:skills
      - name: Deploy policy
        run: pnpm check:deploy
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Tests
        run: pnpm test
      - name: OpenSpec
        run: pnpm openspec:validate
      - name: Spec workflow
        run: pnpm check:specs
      - name: Build
        run: pnpm build
      - name: Install Playwright
        run: pnpm --filter @agent-app/e2e exec playwright install --with-deps chromium
      - name: End-to-end
        run: pnpm test:e2e
      - name: Install Helm
        run: |
          curl -fsSL -o helm.tgz https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          echo "896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz
          sudo mv linux-amd64/helm /usr/local/bin/helm
      - name: Helm
        run: |
          helm lint deploy/helm/agent-app
          helm template demo deploy/helm/agent-app -f deploy/helm/agent-app/values-render-example.yaml >/tmp/rendered.yaml
          if helm template demo deploy/helm/agent-app >/tmp/unsafe.yaml; then
            echo "chart rendered without required secret and origin settings"
            exit 1
          fi

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: agent-app-api:ci
      - name: Build web image without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: agent-app-web:ci
