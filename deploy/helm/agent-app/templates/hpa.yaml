{{- $autoscaling := .Values.autoscaling | default dict }}
{{- if index $autoscaling "enabled" }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "agent-app.fullname" . }}-api
  labels:
    {{- include "agent-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "agent-app.fullname" . }}-api
  minReplicas: {{ index $autoscaling "minReplicas" | default 1 }}
  maxReplicas: {{ index $autoscaling "maxReplicas" | default 3 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ index $autoscaling "targetCPUUtilizationPercentage" | default 80 }}
{{- end }}
