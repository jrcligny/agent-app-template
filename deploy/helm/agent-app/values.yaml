database:
  existingSecret: ""
  urlKey: DATABASE_URL
auth:
  secretKey: AUTH_SECRET
api:
  replicaCount: 1
  image:
    repository: ghcr.io/example/agent-app-api
    tag: local
    pullPolicy: IfNotPresent
  env:
    betterAuthUrl: ""
    trustedOrigins: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
web:
  replicaCount: 1
  image:
    repository: ghcr.io/example/agent-app-web
    tag: local
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi
ingress:
  enabled: true
  className: ""
  host: ""
terminationGracePeriodSeconds: 30
